name: Reconcile Passkey Sign-In implementation
on:
  push:
    paths:
      - '.github/workflows/reconcile-passkey-signin-implementation.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update category ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('auth-model/behavior-category-catalog.json')
          d = json.loads(p.read_text())
          c = next(x for x in d['categories'] if x['key'] == 'passkey-sign-in')
          c['progress']['implementation'] = 'complete'
          d['sourceReferences'].append({
            'sourceType': 'decision',
            'reference': 'ChatGPT conversation 2026-08-11',
            'note': 'Passkey Sign In implementation reconciliation confirmed the existing anonymous passwordless PasskeyController and AppUserPasskeyManager path consumes and validates challenges, resolves exactly one durable user from the credential, validates the WebAuthn assertion, advances the signature counter, emits concrete AuthLogTypes events, and resolves the landing destination.'
          })
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY
          rm .github/workflows/reconcile-passkey-signin-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-model/behavior-category-catalog.json .github/workflows/reconcile-passkey-signin-implementation.yml
          git commit -m "complete passkey sign-in implementation ledger"
          git push
