name: Migrate Auth Reconciliation Progress

on:
  push:
    branches:
      - master
    paths:
      - .github/scripts/migrate_auth_reconciliation_progress.py
      - .github/workflows/migrate-auth-reconciliation-progress.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate authentication reconciliation progress
        run: python .github/scripts/migrate_auth_reconciliation_progress.py
      - name: Validate migrated JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('auth-model').glob('**/*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('All auth-model JSON parsed successfully.')
          PY
          if grep -R '"reconciliationStatus"' auth-model/behaviors-v2 --include='*.json'; then
            echo 'Legacy reconciliationStatus remains in V2 behaviors.'
            exit 1
          fi
      - name: Commit migration and cleanup
        shell: bash
        run: |
          git config user.name "aptix-auth-model"
          git config user.email "aptix-auth-model@users.noreply.github.com"
          git add auth-model
          git rm .github/scripts/migrate_auth_reconciliation_progress.py
          git rm .github/workflows/migrate-auth-reconciliation-progress.yml
          git commit -m "add hierarchical auth reconciliation progress"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
