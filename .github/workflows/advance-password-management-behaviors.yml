name: Advance Password Management Behaviors

on:
  push:
    branches:
      - master
    paths:
      - .github/scripts/advance_password_management_behaviors.py
      - .github/workflows/advance-password-management-behaviors.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile password management behaviors
        run: python .github/scripts/advance_password_management_behaviors.py
      - name: Commit reconciliation and cleanup
        run: |
          rm .github/scripts/advance_password_management_behaviors.py
          rm .github/workflows/advance-password-management-behaviors.yml
          git config user.name "aptix-auth-model"
          git config user.email "aptix-auth-model@users.noreply.github.com"
          git add auth-model .github
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "complete password management behavior review"
          git pull --rebase origin master
          git push origin HEAD:master
