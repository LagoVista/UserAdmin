name: Password sign-in end to end

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/password-sign-in-e2e.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-password-sign-in-e2e.py
      - name: Check patch
        run: git diff --check
      - name: Commit validated patch
        run: |
          git config user.name "Auth Model Patch Bot"
          git config user.email "auth-model-patch-bot@users.noreply.github.com"
          git rm .github/workflows/password-sign-in-e2e.yml
          git rm .github/scripts/patch-password-sign-in-e2e.py
          git add -A
          git commit -m "complete password sign-in test setup and receipt"
          git push origin HEAD:master
