name: Auth test receipt result

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/auth-run-receipt-result.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-auth-run-receipt-result.py
      - name: Check patch
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "Auth Model Patch Bot"
          git config user.email "auth-model-patch-bot@users.noreply.github.com"
          git rm .github/workflows/auth-run-receipt-result.yml
          git rm .github/scripts/patch-auth-run-receipt-result.py
          git add -A
          git commit -m "propagate auth test receipt failures"
          git push origin HEAD:master
