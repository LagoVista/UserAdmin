name: Password reset authority setup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/password-reset-authority-setup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-password-reset-authority-setup.py
      - name: Check patch
        run: git diff --check
      - name: Commit setup support
        run: |
          git config user.name "Auth Model Patch Bot"
          git config user.email "auth-model-patch-bot@users.noreply.github.com"
          git rm .github/workflows/password-reset-authority-setup.yml
          git rm .github/scripts/patch-password-reset-authority-setup.py
          git add -A
          git commit -m "materialize password reset authority for auth tests"
          git push origin HEAD:master
